name: Reproducibility checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recompute Gaussian study
        run: python src/experiment.py
      - name: Recompute real-data studies
        run: |
          python src/real_data.py
          python src/known_prior_benchmark.py
      - name: Run validation suite
        run: python -m pytest -q tests/
      - name: Regenerate tables and flowchart
        run: |
          python src/generate_tables.py
          python src/create_flowchart.py
      - name: Upload computed data and figures
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-research-results
          path: |
            results/
            figures/
            paper/*_table.tex
