name: Reproducibility checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Recompute Gaussian study
        run: python src/experiment.py
      - name: Recompute real-data studies
        run: |
          python src/real_data.py
          python src/known_prior_benchmark.py
      - name: Run validation suite
        run: python -m pytest -q tests/
      - name: Regenerate tables and flowchart
        run: |
          python src/generate_tables.py
          python src/create_flowchart.py
          python src/plot_known_prior.py
      - name: Upload computed data and figures
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-research-results
          path: |
            results/
            figures/
            paper/*_table.tex
      - name: Commit generated research assets
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results figures paper/*_table.tex
          if ! git diff --cached --quiet; then
            git commit -m "Reproduce and track research figures and datasets [skip ci]"
            git push origin HEAD:main
          fi
